<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 1512" width="708" height="1512" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="hero2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="708" height="1512" fill="#FFFFFF"/>

  <!-- status bar -->
  <text x="44" y="64" font-size="30" font-weight="700" fill="#0A0A0A">9:41</text>
  <rect x="612" y="44" width="46" height="24" rx="7" fill="none" stroke="#0A0A0A" stroke-width="3"/>
  <rect x="618" y="48" width="32" height="16" rx="3" fill="#0A0A0A"/>

  <!-- header -->
  <text x="54" y="200" font-size="64" font-weight="800" fill="#0A0A0A">Messages</text>

  <!-- search -->
  <rect x="54" y="248" width="600" height="74" rx="20" fill="#F2F2F7"/>
  <text x="84" y="295" font-size="30" fill="#8A8A8E">Search</text>

  <!-- chat rows -->
  <g>
    <circle cx="98" cy="420" r="44" fill="#38BDF8"/>
    <text x="162" y="408" font-size="34" font-weight="700" fill="#111113">Priya</text>
    <text x="162" y="452" font-size="28" fill="#8A8A8E">On my way! 🚗</text>
    <text x="640" y="404" font-size="24" text-anchor="end" fill="#8A8A8E">9:32</text>

    <circle cx="98" cy="560" r="44" fill="#34D399"/>
    <text x="162" y="548" font-size="34" font-weight="700" fill="#111113">Design team</text>
    <text x="162" y="592" font-size="28" fill="#8A8A8E">Alex: shipped the build ✅</text>
    <text x="640" y="544" font-size="24" text-anchor="end" fill="#8A8A8E">8:10</text>

    <circle cx="98" cy="700" r="44" fill="#FB923C"/>
    <text x="162" y="688" font-size="34" font-weight="700" fill="#111113">Mom</text>
    <text x="162" y="732" font-size="28" fill="#8A8A8E">Call me when free</text>
    <text x="640" y="684" font-size="24" text-anchor="end" fill="#8A8A8E">Yest</text>

    <circle cx="98" cy="840" r="44" fill="#A78BFA"/>
    <text x="162" y="828" font-size="34" font-weight="700" fill="#111113">Standup</text>
    <text x="162" y="872" font-size="28" fill="#8A8A8E">3 new messages</text>
    <text x="640" y="824" font-size="24" text-anchor="end" fill="#8A8A8E">Mon</text>
  </g>

  <!-- compose button -->
  <circle cx="608" cy="1360" r="56" fill="url(#hero2)"/>
  <text x="608" y="1378" font-size="56" text-anchor="middle" fill="#FFFFFF">+</text>
</svg>
