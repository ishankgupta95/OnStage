<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 1512" width="708" height="1512" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#D946EF"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="artGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="0.4" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- screen background -->
  <rect x="0" y="0" width="708" height="1512" fill="#FFFFFF"/>

  <!-- status bar -->
  <text x="44" y="64" font-size="30" font-weight="700" fill="#0A0A0A">9:41</text>
  <rect x="612" y="44" width="46" height="24" rx="7" fill="none" stroke="#0A0A0A" stroke-width="3"/>
  <rect x="618" y="48" width="32" height="16" rx="3" fill="#0A0A0A"/>

  <!-- album art -->
  <rect x="54" y="150" width="600" height="600" rx="44" fill="url(#art)"/>
  <rect x="54" y="150" width="600" height="600" rx="44" fill="url(#artGloss)"/>

  <!-- track info -->
  <text x="54" y="846" font-size="54" font-weight="800" fill="#0A0A0A">Midnight City</text>
  <text x="54" y="902" font-size="32" fill="#8A8A8E">M83</text>
  <text x="640" y="876" font-size="48" text-anchor="end" fill="#FB7185">&#9829;</text>

  <!-- progress -->
  <rect x="54" y="980" width="600" height="8" rx="4" fill="#E5E5EA"/>
  <rect x="54" y="980" width="222" height="8" rx="4" fill="#0A0A0A"/>
  <circle cx="276" cy="984" r="13" fill="#0A0A0A"/>
  <text x="54" y="1030" font-size="24" fill="#8A8A8E">1:24</text>
  <text x="654" y="1030" font-size="24" text-anchor="end" fill="#8A8A8E">-2:39</text>

  <!-- controls -->
  <polygon points="232,1100 232,1156 198,1128" fill="#0A0A0A"/>
  <polygon points="268,1100 268,1156 234,1128" fill="#0A0A0A"/>
  <circle cx="354" cy="1128" r="72" fill="#10B981"/>
  <polygon points="334,1090 334,1166 396,1128" fill="#FFFFFF"/>
  <polygon points="476,1100 476,1156 510,1128" fill="#0A0A0A"/>
  <polygon points="440,1100 440,1156 474,1128" fill="#0A0A0A"/>

  <!-- up next -->
  <text x="54" y="1300" font-size="30" font-weight="700" fill="#0A0A0A">Up next</text>
  <rect x="54" y="1336" width="64" height="64" rx="14" fill="#A78BFA"/>
  <text x="138" y="1362" font-size="30" font-weight="600" fill="#111113">Outro</text>
  <text x="138" y="1398" font-size="24" fill="#8A8A8E">M83</text>
</svg>
